<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Aidana Kokumova</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-btn {
            background: #4CAF50;
            color: white;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            margin-left: 10px;
        }

        li {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }

        .empty {
            text-align: center;
            color: gray;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 My Notes</h1>

    <div>
        <input id="text" placeholder="Напиши заметку...">
        <button class="add-btn" onclick="add()">+</button>
    </div>

    <ul id="list"></ul>

    <div id="empty" class="empty">Пока нет заметок</div>
</div>

<script>
    const API = "https://fullstack-app-production-a92e.up.railway.app";

    async function load() {
        const res = await fetch(API + "/api/data");
        const data = await res.json();

        const list = document.getElementById("list");
        const empty = document.getElementById("empty");

        list.innerHTML = "";

        if (data.length === 0) {
            empty.style.display = "block";
        } else {
            empty.style.display = "none";
        }

        data.forEach(item => {
            const li = document.createElement("li");

            const span = document.createElement("span");
            span.innerText = item.text;

            const btn = document.createElement("button");
            btn.innerText = "Удалить";
            btn.className = "delete-btn";
            btn.onclick = () => remove(item.id);

            li.appendChild(span);
            li.appendChild(btn);

            list.appendChild(li);
        });
    }

    async function add() {
        const text = document.getElementById("text").value;

        if (!text.trim()) return;

        await fetch(API + "/api/data", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text})
        });

        document.getElementById("text").value = "";
        load();
    }

    async function remove(id) {
        await fetch(API + "/api/data/" + id, {
            method: "DELETE"
        });

        load();
    }

    load();
</script>

</body>
</html>
